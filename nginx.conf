# ---------------------------------------------------------------------------
# ScoreSage - Nginx reverse proxy
#
# Install to:  /etc/nginx/sites-available/scoresage
# Enable with: ln -s /etc/nginx/sites-available/scoresage /etc/nginx/sites-enabled/
#
# Deploy in two passes:
#   1. Start with ONLY the port 80 server block below (comment out the 443 one
#      and the redirect inside it) so Certbot can complete the HTTP-01 challenge.
#   2. Run `certbot --nginx -d scoresage.wharveytech.com`. Certbot rewrites this
#      file with the certificate paths and the HTTP->HTTPS redirect.
#
# Runs alongside the trading dashboard (7888) and AutoMail (7889) on the same
# VPS, so ScoreSage's container is published on host port 7890: set PORT=7890
# in .env (docker-compose.yml maps 127.0.0.1:${PORT}:3000).
# ---------------------------------------------------------------------------

# Pages make bursts of small API calls (live polling, settings), so the
# general zone is generous; the login route gets its own tight one.
limit_req_zone $binary_remote_addr zone=scoresage_api:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=scoresage_login:10m rate=5r/m;

upstream scoresage_app {
    server 127.0.0.1:7890;
    keepalive 32;
}

# --- HTTP: Redirect all traffic to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name scoresage.wharveytech.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Comment this out during the first Certbot run.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Hardened Proxy Configuration ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scoresage.wharveytech.com;

    # SSL Certificates managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/scoresage.wharveytech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoresage.wharveytech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Defence in depth for the Next.js middleware login gate (CVE-2025-29927):
    # this header must never be allowed to arrive from a client.
    proxy_set_header x-middleware-subrequest "";

    # --- Limits ---
    # The largest body ScoreSage accepts is a model parameter JSON from the Lab.
    client_max_body_size 2M;
    client_body_timeout  30s;

    # Jobs return immediately and are polled, but a manual "predict now" on
    # the match page waits for the AI provider, which can take a minute.
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # --- Static assets: immutable, cache hard ---
    location /_next/static/ {
        proxy_pass http://scoresage_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Login: brute-force protection ---
    location = /api/auth/login {
        limit_req zone=scoresage_login burst=5 nodelay;

        proxy_pass http://scoresage_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header x-middleware-subrequest "";
    }

    # --- API: rate limited ---
    location /api/ {
        limit_req zone=scoresage_api burst=60 nodelay;

        proxy_pass http://scoresage_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header x-middleware-subrequest "";

        # Streamed responses must not be buffered.
        proxy_buffering off;
    }

    # --- Application ---
    location / {
        proxy_pass http://scoresage_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header x-middleware-subrequest "";

        proxy_cache_bypass $http_upgrade;
    }
}
